<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlatDesk</title>
  <meta name="description" content="Your building's complaints, in one place. Post problems, tap Me too, and see when they're fixed.">

  <!-- Icons, and "Add to Home Screen" so it opens like an app -->
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f6fed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FlatDesk">

  <!-- The preview card WhatsApp and other apps show when the link is shared -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FlatDesk">
  <meta property="og:title" content="FlatDesk: your building's complaints, in one place">
  <meta property="og:description" content="Post problems, tap Me too, and see when they're fixed. No more complaints lost in the WhatsApp group.">
  <meta property="og:url" content="https://neighborhood-hacks.deployxa.online/">
  <meta property="og:image" content="https://neighborhood-hacks.deployxa.online/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="FlatDesk: your building's complaints, in one place">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="topbar">
      <a href="#/" class="brand">
        <img class="brand-mark" src="assets/icon.svg" alt="" width="30" height="30">
        FlatDesk
      </a>
      <div id="who" class="who"></div>
    </div>
    <!-- "Admin view" strip, only shown to admins -->
    <div id="mode-banner" class="mode-banner" hidden></div>
  </header>

  <!-- Each screen is drawn into here by app.js -->
  <main id="app" class="container"><p class="empty">Loading…</p></main>

  <!-- Pop-up messages like "Complaint posted" -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
